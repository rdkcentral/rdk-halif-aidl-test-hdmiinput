hdmiinput:
  description: "HDMIINPUT L1, L2 and L3 test setup"
  restart_required: False
  test_suites: # List of L1 and L2 test suites
    ######################################
    # Entry to run all test case
    ######################################
    #  - name: "VTS_L1_HDMICEC"
    #    test_cases:
    #      - all
    #######################################
    # Entries to run individual test cases
    #######################################
    - name: "VTS_L1_HDMIINPUT"
      test_cases:
        - "getHDMIInputIds_pos"
        - "getHDMIInput_pos"
        - "getHDMIInput_neg"
        - "getPlatformCapabilities_pos"
        - "getCapabilities_pos"
        - "getProperty_pos"
        - "getProperty_neg"
        - "getState_pos"
        - "getEDID_pos"
        - "getDefaultEDID_pos"
        - "getDefaultEDID_neg"
        - "getHDCPCurrentVersion_pos"
        - "getHDCPStatus_pos"
        - "getSPDInfoFrame_pos"
        - "open_pos"
        - "open_neg"
        - "close_pos"
        - "close_neg"
        - "registerEventListener_pos"
        - "registerEventListener_neg"
        - "unregisterEventListener_pos"
        - "unregisterEventListener_neg"
        - "getConnectionState_pos"
        - "start_pos"
        - "start_neg"
        - "stop_pos"
        - "stop_neg"
        - "setEDID_pos"
        - "setEDID_neg"
    - name: "VTS_L2_HDMIINPUT"
      test_cases:
        - "StateTransitions"
        - "DefaultCallbacks"
        - "SetandGetEDID"
        - "MaxConcurrentPorts"
    - name: "VTS_L3_HDMIINPUT"
      test_cases:
        - "ConnectionTestAfterOpen"
        - "ConnectionTestAfterStart"
        - "InfoFramesTest"
        - "EDIDTest"
