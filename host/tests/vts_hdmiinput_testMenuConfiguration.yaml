hdmiinput:
    description: "hdmi input testing profile / menu system for UT"
    test:
        artifacts:
        #List of artifacts folders, test class copies the content of folder to the target device workspace
          - "../../build/bin/vts-HdmiInput.tar.gz"
        # exectute command, this will appended with the target device workspace path
        execute: "./run.sh"
        type: UT-C # C (UT-C Cunit) / C++ (UT-G (g++ ut-core gtest backend))
        suites:
            0:
                name: "VTS_L1_HDMIINPUT"
                tests:
                    - "getHDMIInputIds_pos"
                    - "getHDMIInput_pos"
                    - "getHDMIInput_neg"
                    - "getPlatformCapabilities_pos"
                    - "getCapabilities_pos"
                    - "getProperty_pos"
                    - "getProperty_neg"
                    - "getState_pos"
                    - "getEDID_pos"
                    - "getDefaultEDID_pos"
                    - "getDefaultEDID_neg"
                    - "getHDCPCurrentVersion_pos"
                    - "getHDCPStatus_pos"
                    - "getSPDInfoFrame_pos"
                    - "open_pos"
                    - "open_neg"
                    - "close_pos"
                    - "close_neg"
                    - "registerEventListener_pos"
                    - "registerEventListener_neg"
                    - "unregisterEventListener_pos"
                    - "unregisterEventListener_neg"
                    - "getConnectionState_pos"
                    - "start_pos"
                    - "start_neg"
                    - "stop_pos"
                    - "stop_neg"
                    - "setEDID_pos"
                    - "setEDID_neg"
            1:
                name: "VTS_L2_HDMIINPUT"
                tests:
                    - "StateTransitions"
                    - "DefaultCallbacks"
                    - "SetandGetEDID"
                    - "MaxConcurrentPorts"
            2:
                name: "VTS_L3_HDMIINPUT"
                tests:
                    - "ConnectionTestAfterOpen"
                    - "ConnectionTestAfterStart"
                    - "InfoFramesTest"
                    - "EDIDTest"
