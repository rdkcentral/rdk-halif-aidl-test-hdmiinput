hdmiinput:
  L3:
    ConnectionTestAfterOpen:
      ports:
        - id: 0  # IHDMIInput.Id
          source_HDCP_Version: VERSION_1_X # Possible values: VERSION_1_X, VERSION_2_X, UNDEFINED
          connection_state_before_open: true # true - connected, false - disconnected
          signal_state_before_open: LOCKED
          connection_state: [false, true, false, true, false, true] # Sequence of expected connection states after open
          signal_state: [NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED] # Sequence of expected signal states after open
          max_wait_time_ms: 30000
        - id: 1  # IHDMIInput.Id
          source_HDCP_Version: VERSION_2_X # Possible values: VERSION_1_X, VERSION_2_X, UNDEFINED
          connection_state_before_open: true # true - connected, false - disconnected
          signal_state_before_open: LOCKED
          connection_state: [false, true, false, true, false, true] # Sequence of expected connection states after open
          signal_state: [NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED] # Sequence of expected signal states after open
          max_wait_time_ms: 30000
    ConnectionTestAfterStart:
      ports:
        - id: 0  # IHDMIInput.Id
          source_HDCP_Version: VERSION_1_X # Possible values: VERSION_1_X, VERSION_2_X, UNDEFINED
          connection_state_before_open: true # true - connected, false - disconnected
          signal_state_before_open: LOCKED
          connection_state: [false, true, false, true, false, true] # Sequence of expected connection states after start
          signal_state: [NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED, NO_SIGNAL, LOCKED] # Sequence of expected signal states after start
          max_wait_time_ms: 30000

    InfoFramesTest:
      ports:
        - id: 0  # IHDMIInput.Id
          info_frame_type: [AUDIO, AVI, SPD, VSIF, VIC, VRR] # Possible values: AUDIO, AVI, SPD, VSIF, VIC, VRR
          frame_data:
            - [0x84, 0x01, 0x0A, 0x70, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - [0x82, 0x02, 0x0D, 0x6F, 0x10, 0x18, 0x28, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - [0x83, 0x01, 0x19, 0x8E, 0x4F, 0x50, 0x45, 0x4E, 0x41, 0x49, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x42, 0x4C, 0x55, 0x52, 0x41, 0x59, 0x20, 0x20, 0x20, 0x20, 0x20, 0x01]
            - [0x81, 0x01, 0x0D, 0xA7, 0x03, 0x0C, 0x00, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - [VIC16_1920_1080_P_60_16_9] # Possible values: refer hdmiinput/VIC.aidl
            - [true, true, true, 120.0] # VRR parameters: vrrActive, mConst, fastVActive, frameRate
          max_wait_time_ms: 10000

